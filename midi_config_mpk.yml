# MIDI Controller Configuration - MPK Mini Mk II
# Maps physical MIDI controller CC numbers to shader parameters

# Device name to connect to (or "auto" to use first available)
device_name: "MPK Mini Mk II"

# MIDI CC mappings - 8 knobs controlling shader parameters
mappings:
  # Knob 1 (CC 1) -> param0
  - midi_cc: 1
    target: param0
    min: 0
    max: 127

  # Knob 2 (CC 2) -> param1
  - midi_cc: 2
    target: param1
    min: 0
    max: 127

  # Knob 3 (CC 3) -> param2
  - midi_cc: 3
    target: param2
    min: 0
    max: 127

  # Knob 4 (CC 4) -> param3
  - midi_cc: 4
    target: param3
    min: 0
    max: 127

  # Knob 5 (CC 5) -> param4
  - midi_cc: 5
    target: param4
    min: 0
    max: 127

  # Knob 6 (CC 6) -> param5
  - midi_cc: 6
    target: param5
    min: 0
    max: 127

  # Knob 7 (CC 7) -> param6
  - midi_cc: 7
    target: param6
    min: 0
    max: 127

  # Knob 8 (CC 8) -> param7
  - midi_cc: 8
    target: param7
    min: 0
    max: 127

# Notes:
# - CC 1-8 are the 8 rotary knobs on the MPK Mini Mk II
# - MIDI note mappings for pads are in effect_bindings.yml
# - To use this config, rename it to midi_config.yml
