# Effect Configuration
# Defines all effects available in the system
# Each effect maps a shader to an Action enum entry with a node class and trigger mode

effects:

  - action: TOGGLE_DISPLACEMENT_MAP
    shader: shaders/effects/displacement_map.glsl
    node_class: EffectNode
    trigger_mode: toggle

  - action: TOGGLE_FLASH
    shader: shaders/effects/flashing_light.glsl
    node_class: EffectNode
    trigger_mode: toggle

  - action: TOGGLE_FRAME_DIFFERENCING
    shader: shaders/effects/frame_differencing.glsl
    node_class: FrameDifferencingEffectNode
    trigger_mode: toggle

  - action: TOGGLE_GLITCH
    shader: shaders/effects/glitch.glsl
    node_class: EffectNode
    trigger_mode: toggle

  - action: TRIGGER_IMAGE_FLASH
    shader: shaders/effects/image_flash.glsl
    node_class: ImageFlashEffectNode
    trigger_mode: toggle

  - action: TOGGLE_INVERT
    shader: shaders/effects/invert.glsl
    node_class: EffectNode
    trigger_mode: toggle

  - action: TOGGLE_KALEIDOSCOPE
